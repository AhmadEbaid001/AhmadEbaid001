# Keeps the generated figures current.
#
#  - the contribution snake is redrawn and published to the `output` branch
#  - the statistics panel is redrawn from the REST API and committed to main
#
# Both run daily, on every push to main, and on demand from the Actions tab.
name: profile figures

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/stats-*.svg"

permissions:
  contents: write

concurrency:
  group: profile-figures
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake frames
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # colours follow the profile palette rather than the action defaults
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322CD6E&color_dots=%230F141C,%23134E2A,%23177F3F,%231CA855,%2322CD6E
            dist/snake-light.svg?palette=github-light&color_snake=%2310843E&color_dots=%23EAEAE9,%23C6E7D2,%238ACCA6,%2342A96F,%2310843E

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw the statistics panel
        working-directory: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python stats.py "${{ github.repository_owner }}"

      - name: Commit if anything changed
        run: |
          # Scope the check to the two generated files. Looking at the whole
          # assets/ directory once picked up an untracked .pyc, so the step
          # tried to commit and then failed on an empty index.
          git add assets/stats-dark.svg assets/stats-light.svg
          if git diff --cached --quiet; then
            echo "statistics unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh statistics panel"
          git push
