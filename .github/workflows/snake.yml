# Redraws the contribution graph as a snake animation and commits the result
# to the `output` branch, which the README embeds. Runs on a schedule so the
# figure stays current, and can be triggered by hand from the Actions tab.
name: contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake frames
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # colour_snake / colour_dots follow the profile palette
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322CD6E&color_dots=%230F141C,%23134E2A,%23177F3F,%231CA855,%2322CD6E
            dist/snake-light.svg?palette=github-light&color_snake=%2310843E&color_dots=%23EAEAE9,%23C6E7D2,%238ACCA6,%2342A96F,%2310843E

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
